<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-top: 20px;
        }

        .card {
        width: 300px;
        background-color: #efeeee;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card-content {
        padding: 15px;
        }

        .card-content button {
        width: 100%;
        margin-top: 10px;
        background-color: rgb(64, 251, 235);
        border-radius: 5px;
        /* color: white; */
        }
        h4 a {
            text-decoration: none;
            color: black;
        }
        nav {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background-color: #777676;
            height: 40px;
            align-items: center;
        }
        nav button {
            background-color: rgb(64, 251, 235);
            border-radius: 5px;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
        nav a {
            text-align: right;
            text-decoration: none;
            color: black;
        }
        .nav-content, a {
            margin-left: auto;
            display: flex;
            gap: 10px;
            margin-right: 10px;
        }
    </style>
    <title>Books</title>
</head>
<body>
    <h1>Books</h1>
    <nav>
        <!-- <a href="{% url 'home' %}">Home</a>  -->
        {% if user.is_authenticated %}
            <p>Welcome {{ user.username }}</p>
            <div class="nav-content">
                <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
                </form>
            </div>
        {% else %}
            <div class="nav-content">
                <a href="{% url 'login' %}"><button>Login</button></a>
                <a href="{% url 'register' %}"><button>Register</button></a>
            </div>    
        {% endif %}
            
    </nav>

    <h3>Book List</h3>

    <div class="container">
        {% for book in books %}
        <div class="card">
            <div class="card-content">
                <h4><a href="{% url 'book_detail' book.id %}">{{ book.title }}</a></h4>
                <p><strong>Author: </strong>{{ book.author }}</p>
                <p><strong>Price: </strong>${{ book.price }}</p>
                <a href="{% url 'buy_book' book.id %}"><button>Buy Book</button></a>
            </div>
        </div>
        {% empty %}
            <h3>No books available</h3>
        {% endfor %}
    </div>

</body>
</html>
